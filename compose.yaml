name: ${COMPOSE_PROJECT_NAME:-arquibancada-viva}

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arquibancada_viva}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - platform

  redis:
    image: redis:8.8.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - platform

  storage:
    image: rustfs/rustfs:1.0.0-rc.6
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-local-development}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-development-only-32-characters}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - platform

  storage-init:
    image: rustfs/rustfs:1.0.0-rc.6
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-development}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-development-only-32-characters}
      S3_BUCKET: ${S3_BUCKET:-arquibancada-viva-local}
    entrypoint: ["/bin/sh", "/init/init-private-bucket.sh"]
    volumes:
      - ./infra/rustfs/init-private-bucket.sh:/init/init-private-bucket.sh:ro
    networks:
      - platform

networks:
  platform:
    name: ${COMPOSE_PROJECT_NAME:-arquibancada-viva}-platform
    driver: bridge

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-arquibancada-viva}-postgres-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-arquibancada-viva}-redis-data
  storage-data:
    name: ${COMPOSE_PROJECT_NAME:-arquibancada-viva}-storage-data
